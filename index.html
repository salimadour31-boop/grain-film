<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grain Film</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1 id="title">Grain Film</h1>
    <div class="lang-switch">
      <button data-lang="fr">FR</button>
      <button data-lang="en">EN</button>
      <button data-lang="tz">TZ</button>
    </div>
  </header>
  <main>
    <div class="canvas-container">
      <canvas id="preview" width="800" height="450"></canvas>
    </div>
    <div class="controls">
      <label id="lbl-intensity">Intensité</label>
      <input type="range" id="intensity" min="0" max="1" step="0.01" value="0.4">
      <label id="lbl-size">Taille</label>
      <input type="range" id="size" min="1" max="8" step="1" value="2">
      <label id="lbl-tint">Teinte</label>
      <input type="color" id="tint" value="#ffffff">
      <label id="lbl-speed">Vitesse</label>
      <input type="range" id="speed" min="0" max="10" step="0.5" value="0">
      <label id="lbl-bg">Fond</label>
      <input type="file" id="bg-file" accept="image/*">
      <button id="clear-bg">Effacer fond</button>
      <button id="export-png">Exporter PNG</button>
    </div>
  </main>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
